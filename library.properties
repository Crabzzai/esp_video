name=esp_video
version=1.0.0
author=Crabzzai
maintainer=Crabzzai
sentence=ESP32 Video Streaming Library
paragraph=This library allows you to stream video from an ESP32 camera module to another ESP32 device through UDP protocol across a Wi-Fi network access point. It is designed to both support ESP32 modules with and without PSRAM. It displays the video stream on a TFT display connected to the receiving ESP32 device. The library also enables the ESP32 camera module to capture images and videos and save them to an SD card.
category=Communication
url=https://github.com/Crabzzai/esp_video
architectures=esp32
includes=SharedConfig.h,EspCameraSource.h,EspStreamer.h,EspRecorder.h,EspReceiver.h